name: Auto Tag & Release on version bump

# When package.json's version changes on main, create the matching v<version>
# tag and GitHub release automatically. Pairs with deploy.yml (Fly deploy on the
# same push). release.yml stays for manually pushed tags.
#
# Note: the tag is created here via GITHUB_TOKEN, which by design does NOT
# trigger release.yml — so this job creates the release itself to avoid relying
# on that (otherwise no release would ever be produced for auto-created tags).

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

jobs:
  auto-release:
    name: Auto release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag already exists
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.pkg.outputs.version }} already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract this version's CHANGELOG section
        if: steps.tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          # Lines under "## [VERSION] …" up to the next "## [" heading
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          # Drop leading blank lines
          sed -i -e '/./,$!d' RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "_No curated notes for this version — see CHANGELOG.md._" > RELEASE_NOTES.md
          fi
          echo "----- release notes for v$VERSION -----"
          cat RELEASE_NOTES.md

      - name: Create tag and GitHub release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: "🎵 Musician Tools v${{ steps.pkg.outputs.version }}"
          # The release body is EXACTLY this version's CHANGELOG section — no
          # auto-generated commit list or "Full Changelog" diff appended.
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
